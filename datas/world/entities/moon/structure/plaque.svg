<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
  <!-- 기념 명판: 착륙선 앞다리에 붙어 있던 스테인리스 명판을 작은 받침대에 세운 모습. 위에 지구의 두 반구, 아래 "우리는 모든 인류를 위해 평화롭게 왔다" 문구 줄 -->
