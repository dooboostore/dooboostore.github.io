  </g>
  <g fill="#aeb4ba"><ellipse cx="4.2" cy="3" rx="0.6" ry="0.4"/><ellipse cx="7.8" cy="3.4" rx="0.5" ry="0.6"/></g>
  <g stroke="#8b9197" stroke-width="0.3" stroke-linecap="round"><path d="M2.6 5.2 H9.4 M3 6 H9 M4 6.7 H8"/></g>
