    <rect x="5.4" y="7" width="1.2" height="4.4" rx="0.5" fill="#aeb4ba"/>
    <ellipse cx="6" cy="11.3" rx="1.6" ry="0.5" fill="#c9ccd1"/>
    <rect x="1.2" y="1.2" width="9.6" height="6.2" rx="1" fill="#e3e6e9"/>
