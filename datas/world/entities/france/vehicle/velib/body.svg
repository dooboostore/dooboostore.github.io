<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 18">
  <!-- 벨리브 공유자전거 탄 사람 (오른쪽을 향함): 민트색 자전거, 앞 바구니, 페달을 굴리는 다리 -->
