    <g stroke-width="0.4"><animateTransform attributeName="transform" type="rotate" values="0 7 15.2;360 7 15.2" dur="0.9s" repeatCount="indefinite"/>
      <path d="M7 15.2 L7 13.4" fill="none" stroke="#3d3d44" stroke-width="0.5"/>
