<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 12">
  <style>@keyframes whspin{to{transform:rotate(360deg)}}</style>
  <!-- car — 바퀴·그림자를 body 안에 합친 단일 SVG (tools/merge-vehicles.mjs) -->
  <g transform="translate(11 11.6) translate(0 0) scale(2.2)">
  <ellipse rx="5" ry="1.5" fill="#3b5a2e" opacity="0.22"/>
</g>
  <!-- 파리의 작은 해치백 (오른쪽을 향함): 동글동글 파스텔 차체(변수 car), 둥근 창, 지붕 위 짐. 밤엔 전조등 -->
  <path d="M21 6.6 L30 4.6 L30 10 L21 8.6 Z" fill="#fff2b0" style="opacity: calc(var(--night, 0) * 0.5)"/>
  <g stroke="#5b4636" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="5" y="0.6" width="7" height="1.4" rx="0.6" fill="#c99b62"/>
    <path d="M1.2 9.4 L1.2 6.4 C1.2 5.4 2 5 3 4.8 L4.6 2.6 C5.2 1.8 6 1.6 7 1.6 L13.4 1.6 C14.6 1.6 15.4 2 16.2 3 L18 5 C19.8 5.2 20.8 5.8 20.8 7.2 L20.8 9.4 Q11 10.4 1.2 9.4 Z" fill="var(--car, #f2b5a0)"/>
    <path d="M5.4 4.8 L6.4 3.2 Q6.8 2.6 7.6 2.6 L10.4 2.6 L10.4 4.8 Z" fill="#d8eff9"/>
    <path d="M11.4 2.6 L13.2 2.6 Q14 2.6 14.6 3.2 L16 4.8 L11.4 4.8 Z" fill="#d8eff9"/>
  </g>
  <rect x="1.6" y="7.6" width="18.8" height="1.6" rx="0.8" fill="#000" opacity="0.1"/>
  <path d="M3 5.6 L18 5.6" stroke="#fff" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="10.9" y1="5.2" x2="10.9" y2="8.6" stroke="#5b4636" stroke-width="0.3"/>
  <circle cx="20.1" cy="6.6" r="0.6" fill="#fff4b8" stroke="#5b4636" stroke-width="0.25"/>
  <rect x="1.2" y="6" width="0.8" height="1" rx="0.3" fill="#ef6a5e"/>
  <g transform="translate(5.2 9.8)"><g class="w" style="transform-box:fill-box;transform-origin:50% 50%;animation:whspin .9s linear infinite;"><g transform="translate(0 0) scale(0.8)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
</g></g></g>
  <g transform="translate(16.6 9.8)"><g class="w" style="transform-box:fill-box;transform-origin:50% 50%;animation:whspin .9s linear infinite;"><g transform="translate(0 0) scale(0.8)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
</g></g></g>
</svg>
