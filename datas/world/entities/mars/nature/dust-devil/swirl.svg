<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 22">
  <!-- 화성 먼지 회오리 (부품): 깔때기를 감싸고 도는 먼지 띠들. 점선 무늬가 고리를 따라 흘러 빙글빙글 도는 것처럼 보이고, 기둥이 살짝 흔들린다 -->
  <g>
    <animateTransform attributeName="transform" type="skewX" values="0;3;-2;0" dur="3s" repeatCount="indefinite"/>
    <g fill="none" stroke-linecap="round">
      <ellipse cx="7" cy="4" rx="5.4" ry="1" stroke="#f3e2c8" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.8">
        <animate attributeName="stroke-dashoffset" values="0;-14" dur="0.9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="7" cy="8.4" rx="4" ry="0.8" stroke="#c49464" stroke-width="0.5" stroke-dasharray="3 2.5" opacity="0.6">
        <animate attributeName="stroke-dashoffset" values="0;-11" dur="0.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="7" cy="12.6" rx="2.8" ry="0.6" stroke="#f3e2c8" stroke-width="0.45" stroke-dasharray="2.4 2" opacity="0.8">
        <animate attributeName="stroke-dashoffset" values="0;-8.8" dur="0.7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="7" cy="16.6" rx="1.8" ry="0.45" stroke="#c49464" stroke-width="0.4" stroke-dasharray="1.6 1.4" opacity="0.6">
        <animate attributeName="stroke-dashoffset" values="0;-6" dur="0.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
