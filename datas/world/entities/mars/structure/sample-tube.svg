<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 3">
  <!-- 화성 시료관: 퍼서비어런스가 바위 가루를 담아 땅에 내려놓은 작은 흰 관. 언젠가 지구로 데려올 날을 기다리며 반짝 -->
  <ellipse cx="4" cy="2.5" rx="3.4" ry="0.4" fill="#3a3632" opacity="0.2"/>
  <rect x="0.8" y="0.9" width="5.6" height="1.4" rx="0.7" fill="#f6f4ee" stroke="#5b4636" stroke-width="0.22"/>
  <rect x="5.4" y="0.8" width="1.8" height="1.6" rx="0.6" fill="#aeb4ba" stroke="#5b4636" stroke-width="0.22"/>
  <path d="M1.4 1.2 H4.6" stroke="#fff" stroke-width="0.25" stroke-linecap="round"/>
  <circle cx="5.9" cy="1.1" r="0.35" fill="#fff">
