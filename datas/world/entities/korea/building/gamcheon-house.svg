    <rect x="2.2" y="7.4" width="17.6" height="11.4" rx="1.2" fill="var(--wall, #f3d38a)"/>
    <path d="M1.2 7.6 Q2 4.2 5 4.2 L17 4.2 Q20 4.2 20.8 7.6 Z" fill="var(--roof, #c2523f)"/>
