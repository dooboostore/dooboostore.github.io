<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 17">
  <style>@keyframes whspin{to{transform:rotate(360deg)}}</style>
  <!-- bicycle — 바퀴·그림자를 body 안에 합친 단일 SVG (tools/merge-vehicles.mjs) -->
