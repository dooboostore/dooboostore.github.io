  <path d="M7 7.6 Q7.6 6.6 8.6 6.4" stroke="#fff" stroke-opacity="0.35" stroke-width="0.45" fill="none" stroke-linecap="round"/>
  <ellipse cx="12.2" cy="4.6" rx="0.42" ry="0.6" fill="#3d2b22"/>
  <ellipse cx="12.4" cy="5.7" rx="0.6" ry="0.35" fill="#ff9e9e" opacity="0.6"/>
  <g transform="translate(3.4 14.6)"><g class="w" style="transform-box:fill-box;transform-origin:50% 50%;animation:whspin .9s linear infinite;"><g transform="translate(0 0) scale(1.1)">
