    <circle cx="10.4" cy="4.2" r="2.9" fill="var(--skin, #ffe0c7)"/>
    <path d="M7.4 4.4 C7.2 1.8 8.8 0.9 10.4 0.9 C12.2 0.9 13.4 2 13.4 3.4 L11 3.2 C10.4 3.2 10 4 9.4 4.4 L8.4 5.6 Z" fill="var(--helmet, #ffffff)"/>
  </g>
  <path d="M9.4 6.4 L12.4 7.8" stroke="#5b4636" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M9.4 6.4 L12.4 7.8" stroke="var(--shirt, #f0a45a)" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="12.5" cy="7.9" r="0.5" fill="var(--skin, #ffe0c7)" stroke="#5b4636" stroke-width="0.3"/>
