</g></g></g>
  <g transform="translate(12.6 14.6)"><g class="w" style="transform-box:fill-box;transform-origin:50% 50%;animation:whspin .9s linear infinite;"><g transform="translate(0 0) scale(1.1)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
</g></g></g>
