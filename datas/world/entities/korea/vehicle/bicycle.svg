  <ellipse rx="5" ry="1.5" fill="#3b5a2e" opacity="0.22"/>
</g>
  <!-- 한강 자전거 (오른쪽을 향함): 헬멧 쓴 라이더, 프레임 색은 CSS 변수 frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4 14.6 L7.8 14.4 L6.6 9.8 Z M6.6 9.8 L11.2 9.4 L7.8 14.4 M11.2 9.4 L12.6 14.6" stroke="#5b4636" stroke-width="1.2"/>
