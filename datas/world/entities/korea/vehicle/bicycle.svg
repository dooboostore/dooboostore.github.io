    <path d="M11.2 9.4 L11.4 8 L12.6 7.8" stroke="#5b4636" stroke-width="0.6"/>
    <path d="M6.8 9.6 L8.8 12 L7.4 14.4" stroke="#5b4636" stroke-width="1.9"/>
    <path d="M6.8 9.6 L8.8 12 L7.4 14.4" stroke="var(--pants, #3f4a5a)" stroke-width="1.3"/>
