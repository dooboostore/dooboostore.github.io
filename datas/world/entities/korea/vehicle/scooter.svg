  <rect x="1" y="5.8" width="4.2" height="1" rx="0.5" fill="#fff" opacity="0.35"/>
  <rect x="1.6" y="7.4" width="3" height="1.4" rx="0.5" fill="#fff" opacity="0.75"/>
