  </g>
  <path d="M8.8 7.6 L12.6 8.2" stroke="#5b4636" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8.8 7.6 L12.6 8.2" stroke="var(--jacket, #3f9ad6)" stroke-width="0.85" stroke-linecap="round"/>
