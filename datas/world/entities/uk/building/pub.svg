  <text x="16" y="17.85" font-size="1.6" font-weight="800" text-anchor="middle" fill="#5b3a26" font-family="Georgia, serif" letter-spacing="0.3">THE ROSE &amp; CROWN</text>
  <g fill="#ffcf6e" style="opacity: calc(0.35 + var(--night, 0) * 0.65)"><rect x="4" y="19.6" width="7.4" height="5.6" rx="0.8"/><rect x="20.6" y="19.6" width="7.4" height="5.6" rx="0.8"/></g>
  <g fill="#ffd77a" style="opacity: var(--night, 0)"><rect x="6" y="10.8" width="4.2" height="4.4" rx="0.6"/><rect x="21.8" y="10.8" width="4.2" height="4.4" rx="0.6"/></g>
  <g stroke="#5b4636" stroke-width="0.35" stroke-linecap="round"><line x1="7.7" y1="19.6" x2="7.7" y2="25.2"/><line x1="24.3" y1="19.6" x2="24.3" y2="25.2"/><line x1="4" y1="22.4" x2="11.4" y2="22.4"/><line x1="20.6" y1="22.4" x2="28" y2="22.4"/></g>
  <circle cx="17.2" cy="23.6" r="0.35" fill="#f3c74f"/>
