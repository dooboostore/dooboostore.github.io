  <rect x="2.4" y="8.4" width="27.2" height="1.6" rx="0.6" fill="#8a5a3f" stroke="#5b4636" stroke-width="0.45"/>
  <path d="M1.6 9 C2.2 7.4 3.8 5.4 6 4.8 L26 4.8 C28.2 5.4 29.8 7.4 30.4 9 Q16 9.8 1.6 9 Z" fill="#6b7480" stroke="#5b4636" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M6 4.8 L26 4.8 C27 5.1 27.6 5.6 28 6.2 L4 6.2 C4.4 5.6 5 5.1 6 4.8 Z" fill="#fff" opacity="0.24"/>
