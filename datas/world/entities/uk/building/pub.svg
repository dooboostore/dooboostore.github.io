<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 30">
  <!-- 영국 펍: 짙은 초록 목조 정면(pub 로 색 변주), 금색 간판 띠, 바람에 흔들리는 걸이 간판, 꽃바구니, 따뜻한 창. 밤엔 불빛 가득 -->
  <ellipse cx="17" cy="28.8" rx="16" ry="1.4" fill="#3b5a2e" opacity="0.2"/>
  <g stroke="#5b4636" stroke-width="0.55" stroke-linejoin="round" stroke-linecap="round">
    <rect x="23" y="1.8" width="3.4" height="5" rx="0.6" fill="#b5654a"/>
    <rect x="23.4" y="0.6" width="1.2" height="1.6" rx="0.5" fill="#d98a5f"/><rect x="25" y="0.6" width="1.2" height="1.6" rx="0.5" fill="#d98a5f"/>
    <rect x="3" y="9" width="26" height="9" rx="0.8" fill="#f1e6cf"/>
    <rect x="2.2" y="16.6" width="27.6" height="11.6" rx="0.9" fill="var(--pub, #2f5d4a)"/>
    <rect x="1.8" y="16" width="28.4" height="2.6" rx="1" fill="var(--pub, #2f5d4a)"/>
    <rect x="1.6" y="27" width="28.8" height="1.6" rx="0.6" fill="#d6cfc3"/>
    <rect x="6" y="10.8" width="4.2" height="4.4" rx="0.6" fill="#d8eef7"/>
    <rect x="13.9" y="10.8" width="4.2" height="4.4" rx="0.6" fill="#d8eef7"/>
    <rect x="21.8" y="10.8" width="4.2" height="4.4" rx="0.6" fill="#d8eef7"/>
    <rect x="4" y="19.6" width="7.4" height="5.6" rx="0.8" fill="#f2d79a"/>
    <rect x="20.6" y="19.6" width="7.4" height="5.6" rx="0.8" fill="#f2d79a"/>
    <path d="M13.6 27.2 L13.6 21.6 C13.6 20.2 14.6 19.4 15.8 19.4 C17 19.4 18 20.2 18 21.6 L18 27.2 Z" fill="#6b3f2e"/>
