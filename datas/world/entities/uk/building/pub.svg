  <path d="M30 13 L33 13" stroke="#2f2c33" stroke-width="0.5" stroke-linecap="round"/>
  <rect x="29.6" y="12.2" width="0.8" height="3" rx="0.4" fill="#2f2c33"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-7 32 13;7 32 13;-7 32 13" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <g stroke="#2f2c33" stroke-width="0.25"><line x1="30.8" y1="13" x2="30.8" y2="14"/><line x1="33.2" y1="13" x2="33.2" y2="14"/></g>
    <rect x="30.2" y="14" width="3.6" height="4.4" rx="0.7" fill="var(--pub, #2f5d4a)" stroke="#5b4636" stroke-width="0.35"/>
    <rect x="30.7" y="14.5" width="2.6" height="3.4" rx="0.5" fill="#e6c25a"/>
    <circle cx="32" cy="16.2" r="0.8" fill="#d8463c" stroke="#5b4636" stroke-width="0.2"/>
  </g>
  <rect x="3.6" y="9.8" width="24.8" height="0.8" rx="0.4" fill="#fff" opacity="0.2"/>
  <rect x="2.6" y="25.6" width="26.8" height="1.4" rx="0.6" fill="#000" opacity="0.1"/>
