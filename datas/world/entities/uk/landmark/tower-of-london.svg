    <rect x="9.6" y="6" width="4.4" height="20" rx="0.8" fill="#ebe3cf"/>
    <rect x="30" y="6" width="4.4" height="20" rx="0.8" fill="#ebe3cf"/>
    <path d="M9.4 6.4 C9.4 4.6 10.4 3.4 11.8 2.6 C13.2 3.4 14.2 4.6 14.2 6.4 Z" fill="#7d8c99"/>
