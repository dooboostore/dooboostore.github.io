    <path d="M24.9 1.4 L24.9 4.6 M22.2 3 L27.6 3" stroke="#fff" stroke-width="1"/>
    <path d="M24.9 1.4 L24.9 4.6 M22.2 3 L27.6 3" stroke="#d8463c" stroke-width="0.5"/>
