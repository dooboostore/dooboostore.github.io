<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40">
  <!-- 타워 브리지 남쪽 교두: 두 고딕 탑(둥근 지붕), 하늘색 윗 보행교 두 줄, 양옆으로 늘어진 하늘색 현수 사슬. 상판은 지면 svg 의 다리로 강을 건넌다. 밤엔 조명 -->
  <ellipse cx="24" cy="38.8" rx="22" ry="1.3" fill="#3b5a2e" opacity="0.22"/>
  <!-- 현수 사슬 (탑 바깥쪽, 땅으로 내려앉음) -->
