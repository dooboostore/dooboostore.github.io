    <path d="M14.4 7.2 L16 4.4 Q16.4 3.8 17 4.2 L17.4 7.2 Z" fill="#cfe9f5"/>
    <rect x="5" y="5.8" width="6" height="1.6" rx="0.8" fill="#3e4348"/>
    <rect x="6.2" y="7.6" width="3.4" height="2.4" rx="1" fill="var(--pants, #3e4b5c)"/>
    <path d="M6.4 7 C6 4.6 6.8 3 8.6 3 C10 3 10.8 4 10.6 5.6 L10.2 7 Z" fill="var(--parka, #e2574c)"/>
    <path d="M9.6 5 L13.8 6.6" stroke="var(--parka, #e2574c)" stroke-width="1.2"/>
    <circle cx="14" cy="6.6" r="0.6" fill="#3e4348"/>
    <circle cx="8.6" cy="2.4" r="2.3" fill="var(--parka, #e2574c)"/>
    <path d="M9.4 0.6 C10.8 0.8 11.4 2 11.2 3.2 C11 4.2 10.2 4.6 9.4 4.4 C9.8 3.4 9.8 1.6 9.4 0.6 Z" fill="#efe6d6"/>
  </g>
  <path d="M9.8 1.2 C10.6 1.6 10.8 2.6 10.6 3.4 C10.2 3.8 9.9 3.8 9.8 3.6 Z" fill="var(--skin, #f6d7bd)"/>
  <path d="M8.6 1.4 L11 1.2" stroke="#3e4348" stroke-width="0.5" stroke-linecap="round"/>
  <circle cx="10.6" cy="1.3" r="0.35" fill="#8fd0ee"/>
  <g fill="#5b6168">
    <circle cx="4.4" cy="11" r="0.55"/><circle cx="7" cy="11" r="0.55"/><circle cx="9.6" cy="11" r="0.55"/><circle cx="12" cy="11" r="0.55"/>
  </g>
  <path d="M3.4 12.6 L12.8 12.6" stroke="#8b9197" stroke-width="0.4" stroke-dasharray="0.6 0.6">
