<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 14">
  <!-- snowmobile — 바퀴·그림자를 body 안에 합친 단일 SVG (tools/merge-vehicles.mjs) -->
  <g transform="translate(12 13.4) translate(0 0) scale(2.2)">
  <ellipse rx="5" ry="1.5" fill="#3b5a2e" opacity="0.22"/>
</g>
  <!-- 스노모빌 (오른쪽을 향함): 앞에 둥근 스키, 뒤에 고무 무한궤도(바퀴 없음), 노란 차체와 바람막이, 빨간 파카를 입은 연구원이 탐. 뒤로 눈가루가 날린다 -->
  <g fill="#fbfdff" stroke="#cfe6f4" stroke-width="0.25">
    <circle cx="1.6" cy="11.6" r="0.9"><animate attributeName="opacity" values="0.9;0;0.9" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="0.8" cy="10" r="0.6"><animate attributeName="opacity" values="0;0.9;0" dur="0.8s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#5b4636" stroke-width="0.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M15 10 L16.6 12.4" stroke="#3e4348" stroke-width="0.6"/>
    <path d="M13.4 12.6 L21.6 12.6 Q23.4 12.6 23.4 11.2" fill="none" stroke="#3e4348" stroke-width="0.9"/>
    <rect x="2.6" y="9.2" width="11" height="3.6" rx="1.8" fill="#3e4348"/>
