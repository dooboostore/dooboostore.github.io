<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 28">
  <!-- 조지타운 연립주택: 알록달록한 3층 벽돌집, 덧창, 둥근 처마 장식, 작은 계단. 색은 wall/trim/door 변수. 밤엔 창 불빛 -->
  <ellipse cx="8" cy="27" rx="7.6" ry="1" fill="#3b5a2e" opacity="0.2"/>
  <g stroke="#5b4636" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round">
  <rect x="1" y="4" width="14" height="22.6" rx="0.9" fill="var(--wall, #f2b8a2)"/>
  <rect x="0.4" y="2.4" width="15.2" height="2.4" rx="1.1" fill="var(--trim, #fbf8f2)"/>
  <rect x="9.6" y="19" width="3.8" height="7.2" rx="1.6" fill="var(--door, #3f6b5a)"/>
  <rect x="9" y="25.8" width="5" height="1.6" rx="0.6" fill="#e6e0d3"/>
  </g>
  <g fill="#b9d6ea" stroke="#5b4636" stroke-width="0.35">
  <rect x="3" y="6.4" width="3" height="4" rx="0.6"/><rect x="10" y="6.4" width="3" height="4" rx="0.6"/>
  <rect x="3" y="12.6" width="3" height="4" rx="0.6"/><rect x="10" y="12.6" width="3" height="4" rx="0.6"/>
  <rect x="3" y="19.4" width="3" height="4" rx="0.6"/>
  </g>
  <g fill="var(--trim, #fbf8f2)" stroke="#5b4636" stroke-width="0.25">
  <rect x="1.9" y="6.4" width="1" height="4" rx="0.3"/><rect x="6.1" y="6.4" width="1" height="4" rx="0.3"/><rect x="8.9" y="6.4" width="1" height="4" rx="0.3"/><rect x="13.1" y="6.4" width="1" height="4" rx="0.3"/>
  <rect x="1.9" y="12.6" width="1" height="4" rx="0.3"/><rect x="6.1" y="12.6" width="1" height="4" rx="0.3"/><rect x="8.9" y="12.6" width="1" height="4" rx="0.3"/><rect x="13.1" y="12.6" width="1" height="4" rx="0.3"/>
  </g>
  <g fill="#ffd77a" style="opacity: var(--night, 0)"><rect x="3.3" y="6.7" width="2.4" height="3.4" rx="0.4"/><rect x="10.3" y="12.9" width="2.4" height="3.4" rx="0.4"/><rect x="3.3" y="19.7" width="2.4" height="3.4" rx="0.4"/></g>
  <circle cx="12.6" cy="22.6" r="0.35" fill="#f2c641"/>
  <rect x="1.4" y="2.8" width="14.2" height="0.8" rx="0.4" fill="#fff" opacity="0.4"/>
  <rect x="1.4" y="23.6" width="13.2" height="2.6" rx="0.6" fill="#000" opacity="0.08"/>
</svg>
