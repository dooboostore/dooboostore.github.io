<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 11">
  <style>@keyframes whspin{to{transform:rotate(360deg)}}</style>
  <!-- taxi — 바퀴·그림자를 body 안에 합친 단일 SVG (tools/merge-vehicles.mjs) -->
  <g transform="translate(11 11) translate(0 0) scale(2.2)">
  <ellipse rx="5" ry="1.5" fill="#3b5a2e" opacity="0.22"/>
</g>
  <!-- 뉴욕 옐로 캡 (오른쪽을 향함): 노란 차체, 체커 띠, 지붕 TAXI 등. 밤엔 등이 켜진다 -->
  <path d="M21 5.6 L31 3.6 L31 10 L21 8.6 Z" fill="#fff2b0" style="opacity: calc(var(--night, 0) * 0.5)"/>
  <circle cx="11" cy="1.2" r="2.8" fill="#ffe27a" style="opacity: calc(var(--night, 0) * 0.35)"/>
  <g stroke="#5b4636" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="9.4" y="0.2" width="3.2" height="1.8" rx="0.7" fill="#fff6d2"/>
    <path d="M4.8 4.8 C5.6 2.6 6.8 1.8 8.6 1.8 L13.6 1.8 C15.2 1.8 16.4 2.6 17.6 4.8 Z" fill="var(--cab, #f6c945)"/>
    <rect x="1" y="4.4" width="20" height="5.4" rx="2.2" fill="var(--cab, #f6c945)"/>
    <path d="M6.4 4.6 C6.8 3.2 7.6 2.7 8.8 2.7 L10.6 2.7 L10.6 4.6 Z" fill="#d8eff9"/>
    <path d="M11.6 4.6 L11.6 2.7 L13.4 2.7 C14.6 2.7 15.4 3.4 16 4.6 Z" fill="#cbe8f5"/>
    <rect x="3" y="6.8" width="16" height="1.1" rx="0.5" fill="#3e4348"/>
  </g>
  <g fill="#fbf8f2" opacity="0.9"><rect x="3.2" y="6.9" width="1.4" height="0.9"/><rect x="5" y="6.9" width="1.4" height="0.9"/><rect x="12.2" y="6.9" width="1.4" height="0.9"/><rect x="14" y="6.9" width="1.4" height="0.9"/><rect x="15.8" y="6.9" width="1.4" height="0.9"/></g>
  <path d="M6.4 4.6 C6.8 3.2 7.6 2.7 8.8 2.7 L10.6 2.7 L10.6 4.6 Z M11.6 4.6 L11.6 2.7 L13.4 2.7 C14.6 2.7 15.4 3.4 16 4.6 Z" fill="#ffe9a3" style="opacity: calc(var(--night, 0) * 0.6)"/>
  <rect x="1.4" y="7.6" width="19.2" height="1.9" rx="0.9" fill="#000" opacity="0.1"/>
  <rect x="2.2" y="4.9" width="17.6" height="1" rx="0.5" fill="#ffffff" opacity="0.35"/>
  <path d="M7.2 3.2 L8.4 3.2" stroke="#fff" stroke-width="0.5" opacity="0.8" stroke-linecap="round"/>
  <rect x="10.2" y="0.6" width="1.7" height="0.5" rx="0.25" fill="#3e4348"/>
  <circle cx="20.3" cy="6.4" r="0.6" fill="#fff4b8" stroke="#5b4636" stroke-width="0.25"/>
  <rect x="0.8" y="5.6" width="0.8" height="1.2" rx="0.4" fill="#e2493b" stroke="#5b4636" stroke-width="0.2"/>
  <g transform="translate(5.6 9.4)"><g class="w" style="transform-box:fill-box;transform-origin:50% 50%;animation:whspin .9s linear infinite;"><g transform="translate(0 0) scale(0.8)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
</g></g></g>
  <g transform="translate(16.6 9.4)"><g class="w" style="transform-box:fill-box;transform-origin:50% 50%;animation:whspin .9s linear infinite;"><g transform="translate(0 0) scale(0.8)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
</g></g></g>
</svg>
