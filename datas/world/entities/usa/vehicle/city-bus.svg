<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 13">
  <!-- city-bus — 바퀴·그림자를 body 안에 합친 단일 SVG (tools/merge-vehicles.mjs) -->
  <g transform="translate(16 13) translate(0 0) scale(3.2)">
  <ellipse rx="5" ry="1.5" fill="#3b5a2e" opacity="0.22"/>
</g>
  <!-- 시내버스 (오른쪽을 향함): 서큘레이터(빨강)·메트로버스(파랑) 를 bus/stripe 변수로. 밤엔 전조등·실내등 -->
  <path d="M31 6.2 L44 3.6 L44 12 L31 9.6 Z" fill="#fff2b0" style="opacity: calc(var(--night, 0) * 0.5)"/>
  <g stroke="#5b4636" stroke-width="0.55" stroke-linejoin="round" stroke-linecap="round">
  <rect x="1" y="1" width="30" height="10" rx="2.6" fill="var(--bus, #d6453d)"/>
  <rect x="2.6" y="2.8" width="21" height="3.8" rx="0.9" fill="#d8eff9"/>
  <path d="M25 2.8 L29.4 2.8 Q30.8 3.4 30.8 6.6 L25 6.6 Z" fill="#cbe8f5"/>
  </g>
  <rect x="2.6" y="2.8" width="21" height="3.8" rx="0.9" fill="#ffe9a3" style="opacity: var(--night, 0)"/>
  <rect x="1.4" y="7.4" width="29.2" height="1.3" fill="var(--stripe, #c9ced3)"/>
  <rect x="1.4" y="8.8" width="29.2" height="1.9" rx="0.9" fill="#000" opacity="0.1"/>
  <g stroke="var(--bus, #d6453d)" stroke-width="0.7"><line x1="7.8" y1="2.8" x2="7.8" y2="6.6"/><line x1="13" y1="2.8" x2="13" y2="6.6"/><line x1="18.2" y1="2.8" x2="18.2" y2="6.6"/></g>
  <rect x="25.6" y="7.2" width="2.4" height="3.4" rx="0.4" fill="#000" opacity="0.12"/>
  <path d="M3.4 3.4 L7 3.4" stroke="#fff" stroke-width="0.6" opacity="0.8" stroke-linecap="round"/>
  <circle cx="30.2" cy="8.8" r="0.7" fill="#fff4b8" stroke="#5b4636" stroke-width="0.25"/>
  <g transform="translate(8 11)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/><g transform="translate(0 0) scale(1)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
</g></g></g>
  <g transform="translate(24 11)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/><g transform="translate(0 0) scale(1)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
</g></g></g>
</svg>
