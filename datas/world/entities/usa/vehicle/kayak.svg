  <g><animateTransform attributeName="transform" type="rotate" values="-28 11 4;28 11 4;-28 11 4" dur="1.4s" repeatCount="indefinite"/>
  <line x1="5" y1="4" x2="17" y2="4" stroke="#8a5a3f" stroke-width="0.4" stroke-linecap="round"/>
  <ellipse cx="4.6" cy="4" rx="1" ry="0.5" fill="#f2c641" stroke="#5b4636" stroke-width="0.25"/><ellipse cx="17.4" cy="4" rx="1" ry="0.5" fill="#f2c641" stroke="#5b4636" stroke-width="0.25"/></g>
  <path d="M4 5.6 Q11 5 18.6 5.6" stroke="#fff" stroke-opacity="0.5" stroke-width="0.4" fill="none"/>
  </g>
