<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9 -10 24 18" data-foot="0.5 0.5">
  <!-- 다누리 (한국 달 궤도선): 금박 두른 네모 몸통, 오른쪽으로 길게 뻗은 파란 태양전지판 날개 하나, 위쪽 하얀 접시 안테나와 섀도캠 통, 몸통에 작은 태극기 -->
  <g stroke="#5b4636" stroke-width="0.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M4 0 L5.4 0" stroke="#8b9197" stroke-width="0.8"/>
    <rect x="5.4" y="-3.2" width="9" height="6.4" rx="0.9" fill="#3f6fb8"/>
    <path d="M-2 -4 L-2.6 -6.4" stroke="#8b9197" stroke-width="0.5"/>
    <ellipse cx="-2.8" cy="-7" rx="3.6" ry="1.9" fill="#fbfaf6"/>
    <rect x="-4.6" y="-4.6" width="8.6" height="9.2" rx="1.4" fill="#f2c14e"/>
    <rect x="1.2" y="-6.6" width="2.4" height="2.8" rx="0.8" fill="#4a4f57"/>
    <rect x="-3.6" y="0.6" width="4.4" height="3" rx="0.4" fill="#fff" stroke-width="0.25"/>
  </g>
  <g stroke="#9fc6ea" stroke-width="0.3" opacity="0.8"><path d="M8.4 -3.2 L8.4 3.2 M11.4 -3.2 L11.4 3.2 M5.4 0 L14.4 0"/></g>
  <circle cx="-2.8" cy="-7" r="0.5" fill="#8b9197"/>
  <circle cx="-1.4" cy="2.1" r="0.85" fill="#3f6fb8"/>
  <path d="M-2.25 2.1 A0.85 0.85 0 0 1 -0.55 2.1 Z" fill="#e2574c"/>
  <path d="M-3.4 -3.4 Q-0.3 -4 2.8 -3.4" stroke="#fff" stroke-opacity="0.6" stroke-width="0.5" fill="none" stroke-linecap="round"/>
  <circle cx="2.6" cy="2.8" r="0.45" fill="#ff5d55"><animate attributeName="opacity" values="1;0.1;1" dur="1.4s" repeatCount="indefinite"/></circle>
</svg>
