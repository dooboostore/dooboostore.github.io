<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">
  <!-- 맨션(일본식 아파트): 타일 외벽(색 변수 wall), 층층 발코니 난간(accent), 볕에 널어둔 이불과 빨래, 옥상 물탱크. 밤엔 집집마다 불빛 -->
  <ellipse cx="15" cy="39" rx="14" ry="1.3" fill="#3b5a2e" opacity="0.22"/>
  <g stroke="#5b4636" stroke-width="0.55" stroke-linejoin="round" stroke-linecap="round">
    <rect x="18" y="0.8" width="7" height="4" rx="1.6" fill="#dcd6cc"/>
    <rect x="2" y="4" width="26" height="34.6" rx="2.4" fill="var(--wall, #efe3cf)"/>
    <path d="M12.6 38.6 L12.6 34.6 Q15 33 17.4 34.6 L17.4 38.6 Z" fill="#a9b6c2"/>
  </g>
  <rect x="22.4" y="5" width="5.2" height="33" rx="2.2" fill="#000" opacity="0.06"/>
  <g fill="#c9dcea">
    <rect x="4" y="6.4" width="5" height="3.4" rx="0.6"/><rect x="12.5" y="6.4" width="5" height="3.4" rx="0.6"/><rect x="21" y="6.4" width="5" height="3.4" rx="0.6"/>
    <rect x="4" y="13.4" width="5" height="3.4" rx="0.6"/><rect x="12.5" y="13.4" width="5" height="3.4" rx="0.6"/><rect x="21" y="13.4" width="5" height="3.4" rx="0.6"/>
    <rect x="4" y="20.4" width="5" height="3.4" rx="0.6"/><rect x="12.5" y="20.4" width="5" height="3.4" rx="0.6"/><rect x="21" y="20.4" width="5" height="3.4" rx="0.6"/>
    <rect x="4" y="27.4" width="5" height="3.4" rx="0.6"/><rect x="21" y="27.4" width="5" height="3.4" rx="0.6"/>
  </g>
  <g fill="#ffd77a" style="opacity: calc(0.3 + var(--night, 0) * 0.7)"><rect x="12.5" y="6.4" width="5" height="3.4" rx="0.6"/><rect x="4" y="20.4" width="5" height="3.4" rx="0.6"/><rect x="21" y="27.4" width="5" height="3.4" rx="0.6"/></g>
  <g fill="#ffd77a" style="opacity: var(--night, 0)"><rect x="21" y="6.4" width="5" height="3.4" rx="0.6"/><rect x="4" y="13.4" width="5" height="3.4" rx="0.6"/><rect x="12.5" y="20.4" width="5" height="3.4" rx="0.6"/><rect x="4" y="27.4" width="5" height="3.4" rx="0.6"/></g>
  <!-- 발코니 난간 -->
  <g fill="var(--accent, #b9c9d6)" stroke="#5b4636" stroke-width="0.45" stroke-linejoin="round">
    <rect x="2.6" y="9.4" width="24.8" height="2.4" rx="0.9"/><rect x="2.6" y="16.4" width="24.8" height="2.4" rx="0.9"/><rect x="2.6" y="23.4" width="24.8" height="2.4" rx="0.9"/><rect x="2.6" y="30.4" width="24.8" height="2.4" rx="0.9"/>
  </g>
  <g fill="#fff" opacity="0.4"><rect x="3.2" y="9.8" width="23.6" height="0.5" rx="0.25"/><rect x="3.2" y="16.8" width="23.6" height="0.5" rx="0.25"/><rect x="3.2" y="23.8" width="23.6" height="0.5" rx="0.25"/><rect x="3.2" y="30.8" width="23.6" height="0.5" rx="0.25"/></g>
  <!-- 널어 둔 이불·빨래 -->
  <g stroke="#5b4636" stroke-width="0.35" stroke-linejoin="round">
    <rect x="12.8" y="8.6" width="4.4" height="4.4" rx="0.8" fill="#f4b6c2"/>
    <rect x="4.4" y="22.6" width="4.2" height="4.2" rx="0.8" fill="#bfe0f6"/>
    <rect x="21.4" y="15.6" width="4.2" height="4" rx="0.8" fill="#fff1a8"/>
  </g>
  <g fill="#fff" opacity="0.5"><rect x="13.2" y="9.4" width="3.6" height="0.6" rx="0.3"/><rect x="4.8" y="23.4" width="3.4" height="0.6" rx="0.3"/></g>
  <g stroke="#5b4636" stroke-width="0.3" fill="#fbfaf6"><rect x="22" y="28.4" width="1.2" height="1.6" rx="0.3"/><rect x="23.8" y="28.4" width="1.2" height="1.8" rx="0.3" fill="#9fc6e0"/></g>
  <rect x="2" y="3.4" width="26" height="1.6" rx="0.8" fill="var(--accent, #b9c9d6)" stroke="#5b4636" stroke-width="0.45"/>
</svg>
