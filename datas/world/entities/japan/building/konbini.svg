<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 20">
  <!-- 편의점(콘비니): 납작한 지붕, 세 줄 색 띠(stripe1·stripe2), 통유리 가게 안 진열대, 자동문. 24시간 밤에도 환하다 -->
  <ellipse cx="17" cy="19" rx="16" ry="1.2" fill="#3b5a2e" opacity="0.2"/>
  <g stroke="#5b4636" stroke-width="0.55" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2" y="3" width="30" height="15.6" rx="1.8" fill="#f7f5ef"/>
    <rect x="1.4" y="2" width="31.2" height="2" rx="1" fill="#e9e5dc"/>
    <rect x="2" y="4.6" width="30" height="4" rx="0.4" fill="var(--stripe1, #f08a3c)"/>
    <rect x="4" y="10" width="17" height="8.2" rx="0.8" fill="#dcefff"/>
    <rect x="23" y="10" width="7" height="8.6" rx="0.6" fill="#cfe6f7"/>
  </g>
  <rect x="2" y="6" width="30" height="1.2" fill="var(--stripe2, #4bae6e)"/>
  <rect x="2" y="7.2" width="30" height="0.8" fill="var(--stripe3, #e2574c)"/>
  <rect x="4" y="10" width="17" height="8.2" rx="0.8" fill="#fff4c4" style="opacity: calc(0.3 + var(--night, 0) * 0.7)"/>
  <rect x="23" y="10" width="7" height="8.6" rx="0.6" fill="#fff4c4" style="opacity: calc(0.3 + var(--night, 0) * 0.7)"/>
  <g stroke="#5b4636" stroke-width="0.3" stroke-linejoin="round">
    <rect x="5.4" y="13" width="6" height="5" rx="0.4" fill="#e6dccb"/><rect x="13.6" y="13" width="6" height="5" rx="0.4" fill="#e6dccb"/>
  </g>
  <g><circle cx="6.6" cy="14.2" r="0.5" fill="#f08a3c"/><circle cx="8.2" cy="14.2" r="0.5" fill="#6cc07a"/><circle cx="9.8" cy="14.2" r="0.5" fill="#e2574c"/><circle cx="15" cy="14.2" r="0.5" fill="#5d8fd6"/><circle cx="16.6" cy="14.2" r="0.5" fill="#f6d34a"/><circle cx="18.2" cy="14.2" r="0.5" fill="#f4b6c2"/>
    <rect x="6" y="15.8" width="4.8" height="0.8" rx="0.3" fill="#fff"/><rect x="14.2" y="15.8" width="4.8" height="0.8" rx="0.3" fill="#fff"/></g>
  <line x1="26.5" y1="10" x2="26.5" y2="18.6" stroke="#5b4636" stroke-width="0.35"/>
  <path d="M5 11 L8 11 L5 14 Z" fill="#fff" opacity="0.5"/>
  <rect x="2.4" y="3.2" width="29.2" height="0.6" rx="0.3" fill="#fff" opacity="0.6"/>
  <rect x="21.6" y="17.4" width="1" height="1.2" rx="0.3" fill="#7fae9c" stroke="#5b4636" stroke-width="0.25"/>
</svg>
