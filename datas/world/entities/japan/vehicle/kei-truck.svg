  </g>
  <g fill="#f08a3c"><circle cx="3.6" cy="3.2" r="0.7"/><circle cx="5.2" cy="3.1" r="0.7"/><circle cx="8.2" cy="3.2" r="0.7"/><circle cx="9.8" cy="3.1" r="0.7"/><circle cx="6.7" cy="0.7" r="0.6"/></g>
  <g fill="#fff" opacity="0.4"><rect x="3" y="4.4" width="3" height="0.5" rx="0.25"/><rect x="7.4" y="4.4" width="3" height="0.5" rx="0.25"/></g>
  <rect x="1.4" y="9" width="19.4" height="1.4" rx="0.6" fill="#000" opacity="0.1"/>
  <path d="M16 3.4 L17.4 3.4" stroke="#fff" stroke-width="0.5" opacity="0.8" stroke-linecap="round"/>
  <circle cx="20.4" cy="7.6" r="0.55" fill="#fff4b8" stroke="#5b4636" stroke-width="0.25"/>
