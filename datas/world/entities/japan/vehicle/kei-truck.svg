  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
</g></g></g>
  <g transform="translate(17 10.4)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/><g transform="translate(0 0) scale(0.8)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
  <circle r="1" fill="var(--hub, #d3d8dd)"/>
  <rect x="-0.25" y="-1" width="0.5" height="2" fill="#8b9197"/>
