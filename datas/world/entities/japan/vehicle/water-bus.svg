<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 14" data-foot="0.5 0.86">
  <!-- water-bus — 바퀴·그림자를 body 안에 합친 단일 SVG (tools/merge-vehicles.mjs) -->
  <!-- 스미다강 수상버스 (오른쪽을 향함): 우주선처럼 둥근 은빛 유리 선체, 물결에 흔들리고 뒤로 물거품. 밤엔 선실 불빛 -->
  <g stroke="#ffffff" stroke-width="0.6" fill="none" stroke-linecap="round">
    <path d="M1 12 Q3 11.4 5 12"><animate attributeName="opacity" values="0;0.9;0" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M0 13 Q2.5 12.4 5.5 13"><animate attributeName="opacity" values="0;0.7;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></path>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.4;0 0" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <g stroke="#5b4636" stroke-width="0.55" stroke-linejoin="round">
      <path d="M4.6 9.4 L38.6 9.4 Q37.4 12.6 33.4 12.8 L8.4 12.8 Q5.6 12.2 4.6 9.4 Z" fill="#e6ebef"/>
      <path d="M6 9.6 C7 5 12 2.4 20 2.4 C28 2.4 34.4 4.6 37.6 9.6 Z" fill="#c6dceb"/>
    </g>
    <path d="M9 8.6 C10 5.6 13.6 3.8 20 3.8 C26 3.8 31 5.4 33.6 8.6 Z" fill="#9fc6e0"/>
    <path d="M9 8.6 C10 5.6 13.6 3.8 20 3.8 C26 3.8 31 5.4 33.6 8.6 Z" fill="#ffe08a" style="opacity: var(--night, 0)"/>
    <path d="M12 6 C14 4.6 17 4 20 4" stroke="#fff" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.8"/>
    <g stroke="#e6ebef" stroke-width="0.5"><line x1="16" y1="3.8" x2="15.4" y2="8.6"/><line x1="22" y1="3.8" x2="22" y2="8.6"/><line x1="28" y1="4.6" x2="28.6" y2="8.6"/></g>
    <rect x="6" y="10.4" width="31.4" height="0.9" fill="#5a93c6"/>
