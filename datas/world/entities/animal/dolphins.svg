<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" data-foot="0.5 0.5">
  <!-- 돌고래 떼 (위에서 본 모습, 앞쪽이 위): 셋이 번갈아 물 위로 솟았다 들어가며 물보라를 남긴다 -->
  <defs>
    <g id="d">
      <path d="M0 -4.6 C1.4 -4.6 1.8 -2 1.6 0.6 C1.4 2.6 0.8 3.6 0 4.2 C-0.8 3.6 -1.4 2.6 -1.6 0.6 C-1.8 -2 -1.4 -4.6 0 -4.6 Z" fill="#8fa3b8" stroke="#5b4636" stroke-width="0.35" stroke-linejoin="round"/>
      <path d="M-1.4 -0.6 L-3 1 L-1.4 0.8 Z M1.4 -0.6 L3 1 L1.4 0.8 Z" fill="#7a8fa5" stroke="#5b4636" stroke-width="0.25" stroke-linejoin="round"/>
      <path d="M0 3.8 L-1.6 5.4 L0 4.8 L1.6 5.4 Z" fill="#7a8fa5" stroke="#5b4636" stroke-width="0.25" stroke-linejoin="round"/>
      <path d="M-0.4 -3.4 Q0 -3.9 0.4 -3.4" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.35" fill="none"/>
    </g>
  </defs>
  <g transform="translate(0 -4)"><use href="#d"><animate attributeName="opacity" values="0.15;1;1;0.15" keyTimes="0;0.25;0.55;1" dur="3s" repeatCount="indefinite"/></use>
    <circle r="3" fill="none" stroke="#ffffff" stroke-width="0.4"><animate attributeName="r" values="1;5" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(-6 3)"><use href="#d"><animate attributeName="opacity" values="0.15;1;1;0.15" keyTimes="0;0.25;0.55;1" dur="3s" begin="-1s" repeatCount="indefinite"/></use>
    <circle r="3" fill="none" stroke="#ffffff" stroke-width="0.4"><animate attributeName="r" values="1;5" dur="3s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" begin="-1s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(6 4)"><use href="#d"><animate attributeName="opacity" values="0.15;1;1;0.15" keyTimes="0;0.25;0.55;1" dur="3s" begin="-2s" repeatCount="indefinite"/></use>
    <circle r="3" fill="none" stroke="#ffffff" stroke-width="0.4"><animate attributeName="r" values="1;5" dur="3s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" begin="-2s" repeatCount="indefinite"/></circle></g>
</svg>
