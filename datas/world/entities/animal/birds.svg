<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 10" data-foot="0.5 0.5">
  <style>@keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(10deg)}}</style>
  <!-- 하늘을 가로지르는 새 떼 -->
  <g fill="none" stroke="#5b4636" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
    <g class="flap" style="transform-box:fill-box;transform-origin:50% 50%;animation:flap .9s ease-in-out infinite;"><path d="M2 4 Q4 2 6 4 Q8 2 10 4"/></g>
    <g class="flap" style="transform-box:fill-box;transform-origin:50% 50%;animation:flap .8s ease-in-out infinite;"><path d="M12 7 Q14 5 16 7 Q18 5 20 7"/></g>
    <g class="flap" style="transform-box:fill-box;transform-origin:50% 50%;animation:flap 1s ease-in-out infinite;"><path d="M15 1.5 Q16.4 0.2 17.8 1.5 Q19.2 0.2 20.6 1.5"/></g>
  </g>
</svg>
