    <path d="M6.4 5.2 L7.9 3.4 Q8.4 3 9 3 L11.6 3 L11.6 5.2 Z" fill="#cfe6f4"/>
    <path d="M12.8 3 L15 3 Q15.6 3 16 3.4 L17.6 5.2 L12.8 5.2 Z" fill="#cfe6f4"/>
  </g>
  <rect x="10.4" y="0.6" width="3.8" height="1.6" rx="0.7" fill="#ffcf5e" style="opacity: calc(0.15 + var(--night, 0) * 0.85)"/>
  <rect x="1.6" y="9.2" width="21.4" height="1.4" rx="0.6" fill="#000" opacity="0.12"/>
  <path d="M3 6 L5.6 6 M8 3.6 L9.4 3.6" stroke="#fff" stroke-width="0.5" opacity="0.6" stroke-linecap="round"/>
