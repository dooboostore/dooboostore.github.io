  <path d="M22.6 7 L32 5 L32 11 L22.6 9.2 Z" fill="#fff2b0" style="opacity: calc(var(--night, 0) * 0.5)"/>
  <g stroke="#5b4636" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="10.4" y="0.6" width="3.8" height="1.6" rx="0.7" fill="#fbf8f0"/>
    <path d="M1.2 10 L1.2 6.8 C1.2 5.8 1.8 5.2 3 5.2 L5.4 5.2 L7.4 2.8 C7.9 2.2 8.6 2 9.4 2 L14.6 2 C15.4 2 16 2.3 16.6 3 L18.6 5.2 L21.6 5.6 C22.6 5.8 23.2 6.4 23.2 7.4 L23.2 10 C23.2 10.6 22.8 11 22.2 11 L2.2 11 C1.6 11 1.2 10.6 1.2 10 Z" fill="var(--bottom, #2f6b74)"/>
