    <g fill="#9bcbe6"><rect x="12.4" y="5.6" width="2.6" height="2" rx="0.4"/><rect x="16.2" y="5.6" width="2.6" height="2" rx="0.4"/><rect x="20" y="5.6" width="2.6" height="2" rx="0.4"/><rect x="23.8" y="5.6" width="2.6" height="2" rx="0.4"/><rect x="27.4" y="5.6" width="2.6" height="2" rx="0.4"/></g>
    <g fill="#ffd77a" style="opacity: var(--night, 0)"><rect x="12.4" y="5.6" width="2.6" height="2" rx="0.4"/><rect x="16.2" y="5.6" width="2.6" height="2" rx="0.4"/><rect x="20" y="5.6" width="2.6" height="2" rx="0.4"/><rect x="23.8" y="5.6" width="2.6" height="2" rx="0.4"/><rect x="27.4" y="5.6" width="2.6" height="2" rx="0.4"/></g>
