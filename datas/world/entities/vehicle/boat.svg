<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 15" data-foot="0.5 0.86">
  <!-- boat — 바퀴·그림자를 body 안에 합친 단일 SVG (tools/merge-vehicles.mjs) -->
