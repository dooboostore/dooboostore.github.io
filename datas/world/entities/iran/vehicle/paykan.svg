  </g>
  <path d="M1.6 7.4 L22.8 7.4" stroke="#d3d8dd" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M12.3 3 L12.3 10.2 M7 5.8 L7 10.2" stroke="#5b4636" stroke-width="0.3" opacity="0.5"/>
  <g fill="#8c939a"><rect x="10.6" y="6.4" width="1" height="0.35" rx="0.17"/><rect x="16" y="6.4" width="1" height="0.35" rx="0.17"/></g>
  <rect x="1.4" y="9.2" width="21.6" height="1.2" rx="0.6" fill="#000" opacity="0.1"/>
