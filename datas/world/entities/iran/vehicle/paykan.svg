<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 12">
  <style>@keyframes whspin{to{transform:rotate(360deg)}}</style>
  <!-- paykan — 바퀴·그림자를 body 안에 합친 단일 SVG (tools/merge-vehicles.mjs) -->
  <g transform="translate(12 11.6) translate(0 0) scale(2.4)">
  <ellipse rx="5" ry="1.5" fill="#3b5a2e" opacity="0.22"/>
</g>
  <!-- 페이칸 (오른쪽을 향함): 1960년대식 반듯한 세 칸 세단, 긴 보닛, 크롬 범퍼와 옆 몰딩, 색은 car 변수. 밤엔 전조등 -->
