</g></g></g>
  <g transform="translate(18.4 10.4)"><g class="w" style="transform-box:fill-box;transform-origin:50% 50%;animation:whspin .9s linear infinite;"><g transform="translate(0 0) scale(0.85)">
  <circle r="2" fill="#3e4348" stroke="#5b4636" stroke-width="0.4"/>
