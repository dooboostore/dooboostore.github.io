<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 964">
  <!-- 케이프타운 지면 — tools/build-city.py 로 생성한 기본 틀 + 아래 '도시 장식' 손그림.
       로컬 좌표 = bounds [[18.36,-34.0],[18.48,-33.9]] 등장방형. 물: OSM 수면 + Natural Earth 10m 바다. 도로: OSM (motorway|trunk) -->
  <defs>
    <pattern id="grass" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="6" fill="#c3e8a2" opacity="0.45"/>
      <path d="M3 8 l1.2 -2.4 l1.2 2.4 M11 17 l1 -2 l1 2 M17 5 l0.9 -1.8 l0.9 1.8" stroke="#86c069" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="13" r="0.7" fill="#fff8d6"/>
      <circle cx="19.5" cy="11" r="0.6" fill="#ffc4d6"/>
    </pattern>
    <pattern id="ripple" width="30" height="22" patternUnits="userSpaceOnUse">
      <path d="M4 8 q3 -2.4 6 0 q3 2.4 6 0 M17 18 q2.4 -2 4.8 0 q2.4 2 4.8 0" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1" fill="none" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect x="-20" y="-20" width="1000" height="1004" fill="#b3de92"/>
  <rect x="-20" y="-20" width="1000" height="1004" fill="url(#grass)"/>

  <!-- 물 (강·호수·바다): 공원 녹지 → 외곽선 → 모래 → 물(+물거품 테두리) → 잔물결 -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M980.6 -192.8L922.8 -1.6L664.4 39.2L356.4 31.4L96.6 241.6L20.5 447.9L-65.5 792.3L-160.0 944.2L-160.0 -192.8L980.6 -192.8Z" fill="#cdeead" stroke="#cdeead" stroke-width="14" fill-rule="evenodd"/>
    <path d="M980.6 -192.8L922.8 -1.6L664.4 39.2L356.4 31.4L96.6 241.6L20.5 447.9L-65.5 792.3L-160.0 944.2L-160.0 -192.8L980.6 -192.8Z" fill="#f3e4bf" stroke="#5b4636" stroke-width="7.2" fill-rule="evenodd"/>
    <path d="M980.6 -192.8L922.8 -1.6L664.4 39.2L356.4 31.4L96.6 241.6L20.5 447.9L-65.5 792.3L-160.0 944.2L-160.0 -192.8L980.6 -192.8Z" fill="#f3e4bf" stroke="#f3e4bf" stroke-width="5.6" fill-rule="evenodd"/>
    <path d="M980.6 -192.8L922.8 -1.6L664.4 39.2L356.4 31.4L96.6 241.6L20.5 447.9L-65.5 792.3L-160.0 944.2L-160.0 -192.8L980.6 -192.8Z" fill="#7cc6ea" stroke="#ffffff" stroke-width="1.6" fill-rule="evenodd" data-zone="water"/>
    <path d="M980.6 -192.8L922.8 -1.6L664.4 39.2L356.4 31.4L96.6 241.6L20.5 447.9L-65.5 792.3L-160.0 944.2L-160.0 -192.8L980.6 -192.8Z" fill="url(#ripple)" fill-rule="evenodd"/>
  </g>

  <!-- 큰 도로 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="" stroke="#5b4636" stroke-width="5.6"/>
    <path d="" stroke="#ece6da" stroke-width="4.2" data-zone="road"/>
    <path d="" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="4 4"/>
  </g>

  <!-- ==== 도시 장식 (손으로: 산·공원·광장·지명 라벨 등, 그림체 가이드 §8.6) ==== -->
  <!-- 테이블베이·대서양 (손으로) -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M-20 -20 L980 -20 L980 130 Q700 110 450 135 Q200 160 -20 120 Z" fill="#b9de98"/>
    <path d="M-20 -20 L980 -20 L980 130 Q700 110 450 135 Q200 160 -20 120 Z" fill="#f3e4bf" opacity="0.0"/>
    <path d="M-20 -20 L980 -20 L980 118 Q700 98 450 123 Q200 148 -20 108 Z" fill="#7cc6ea" data-zone="water"/>
    <path d="M-20 -20 L150 -20 Q120 200 140 400 Q150 600 130 984 L-20 984 Z" fill="#b9de98"/>
    <path d="M150 -20 Q120 200 140 400 Q150 600 130 984" fill="none" stroke="#b9de98" stroke-width="14"/>
    <path d="M138 -20 Q108 200 128 400 Q138 600 118 984 L-20 984 L-20 -20 Z" fill="#f3e4bf"/>
    <path d="M138 -20 Q108 200 128 400 Q138 600 118 984 L-20 984 L-20 -20 Z" fill="#7cc6ea" data-zone="water"/>
    <g fill="#fff" opacity="0.5"><path d="M200 60 q10 -8 20 0 t20 0 M500 80 q10 -8 20 0 t20 0 M60 300 q10 -8 20 0 t20 0"/></g>
  </g>
</svg>
