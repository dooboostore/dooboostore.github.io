<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 686">
  <!-- 암스테르담 지면 — tools/build-city.py 로 생성한 기본 틀 + 아래 '도시 장식' 손그림.
       로컬 좌표 = bounds [[4.7183,52.2736],[5.0897,52.4356]] 등장방형. 물: OSM 수면 + Natural Earth 10m 바다. 도로: OSM (motorway|trunk) -->
  <defs>
    <pattern id="grass" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="6" fill="#c3e8a2" opacity="0.45"/>
      <path d="M3 8 l1.2 -2.4 l1.2 2.4 M11 17 l1 -2 l1 2 M17 5 l0.9 -1.8 l0.9 1.8" stroke="#86c069" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="13" r="0.7" fill="#fff8d6"/>
      <circle cx="19.5" cy="11" r="0.6" fill="#ffc4d6"/>
    </pattern>
    <pattern id="ripple" width="30" height="22" patternUnits="userSpaceOnUse">
      <path d="M4 8 q3 -2.4 6 0 q3 2.4 6 0 M17 18 q2.4 -2 4.8 0 q2.4 2 4.8 0" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1" fill="none" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect x="-20" y="-20" width="1000" height="726" fill="#b3de92"/>
  <rect x="-20" y="-20" width="1000" height="726" fill="url(#grass)"/>

  <!-- 물 (강·호수·바다): 공원 녹지 → 외곽선 → 모래 → 물(+물거품 테두리) → 잔물결 -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="" fill="#cdeead" stroke="#cdeead" stroke-width="14" fill-rule="evenodd"/>
    <path d="" fill="#f3e4bf" stroke="#5b4636" stroke-width="7.2" fill-rule="evenodd"/>
    <path d="" fill="#f3e4bf" stroke="#f3e4bf" stroke-width="5.6" fill-rule="evenodd"/>
    <path d="" fill="#7cc6ea" stroke="#ffffff" stroke-width="1.6" fill-rule="evenodd" data-zone="water"/>
    <path d="" fill="url(#ripple)" fill-rule="evenodd"/>
  </g>

  <!-- 큰 도로 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="" stroke="#5b4636" stroke-width="5.6"/>
    <path d="" stroke="#ece6da" stroke-width="4.2" data-zone="road"/>
    <path d="" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="4 4"/>
  </g>

  <!-- ==== 도시 장식 (손으로: 산·공원·광장·지명 라벨 등, 그림체 가이드 §8.6) ==== -->
  <!-- 운하 3개 + 암스텔강 (손으로) -->
  <g stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M120 100 Q300 40 480 70 Q660 100 840 60" stroke="#5b4636" stroke-width="9"/>
    <path d="M120 100 Q300 40 480 70 Q660 100 840 60" stroke="#7cc6ea" stroke-width="6" data-zone="water"/>
    <path d="M100 220 Q300 150 480 190 Q660 230 860 180" stroke="#5b4636" stroke-width="9"/>
    <path d="M100 220 Q300 150 480 190 Q660 230 860 180" stroke="#7cc6ea" stroke-width="6" data-zone="water"/>
    <path d="M80 340 Q300 270 480 320 Q660 370 880 320" stroke="#5b4636" stroke-width="9"/>
    <path d="M80 340 Q300 270 480 320 Q660 370 880 320" stroke="#7cc6ea" stroke-width="6" data-zone="water"/>
    <path d="M820 -20 Q800 200 830 400 Q850 550 830 706" stroke="#5b4636" stroke-width="11"/>
    <path d="M820 -20 Q800 200 830 400 Q850 550 830 706" stroke="#7cc6ea" stroke-width="7" data-zone="water"/>
  </g>
</svg>
